# MPV custom services

run_command:
  name: Run command
  description: Run an arbitrary MPV command.
  target:
    entity:
      integration: mpv
      domain: media_player
  fields:
    command_string:
      name: Command String
      description: Complete MPV command string including parameters for MPV-specific features not available through standard media_player actions.
      required: true
      example: "show-text \"Hello from Home Assistant\" 3000"
      selector:
        text: